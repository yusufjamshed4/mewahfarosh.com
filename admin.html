<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mewah Farosh — Master Admin Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBW7ihA9k8Y8R2Nvp3wSqkTAubBhopp8pE",
    authDomain: "mewahfarosh-27a98.firebaseapp.com",
    projectId: "mewahfarosh-27a98",
    storageBucket: "mewahfarosh-27a98.firebasestorage.app",
    messagingSenderId: "1030846900586",
    appId: "1.1030846900586:web:5eb9e6b60151f6fc9b9d13",
    measurementId: "G-WXZE8XXVQ0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.Password = "MewahAdmin2026";
  
  window.login = function() {
    if(document.getElementById("passInput").value === window.Password) {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      fetchAdminProducts();
    } else {
      alert("Invalid Admin Password!");
    }
  }

  window.fetchAdminProducts = async function() {
    const listEl = document.getElementById("productList");
    listEl.innerHTML = "<p>Loading products from cloud...</p>";
    const querySnapshot = await getDocs(collection(db, "products"));
    window.adminProducts = [];
    querySnapshot.forEach((docSnap) => {
      window.adminProducts.push({ id: docSnap.id, ...docSnap.data() });
    });
    renderAdminList();
  }

  window.renderAdminList = function() {
    const listEl = document.getElementById("productList");
    if(window.adminProducts.length === 0) {
      listEl.innerHTML = "<p>No products found.</p>";
      return;
    }
    listEl.innerHTML = window.adminProducts.map(p => `
      <div style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:15px; border-radius:12px; margin-bottom:12px; border:1px solid #ddd;">
        <div>
          <b style="font-size:1.1rem; color:#0c3b2e;">${p.name}</b><br>
          <span style="color:#666; font-size:14px;">${p.cat} • ${p.pack} • ₹${p.price} • <span style="color:#b58b3c;">${p.badge || ''}</span></span>
        </div>
        <button onclick="removeProduct('${p.id}')" style="background:#b73232; color:#fff; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-weight:600;">Delete</button>
      </div>
    `).join('');
  }

  window.addNewProduct = async function() {
    const name = document.getElementById("pName").value;
    const cat = document.getElementById("pCat").value;
    const price = Number(document.getElementById("pPrice").value);
    const pack = document.getElementById("pPack").value;
    const badge = document.getElementById("pBadge").value;
    const fileInput = document.getElementById("pImage");

    if(!name || !price) {
      alert("Please enter Product Name and Price!");
      return;
    }

    if(fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = async function(e) {
        await addDoc(collection(db, "products"), { name, cat, price, pack, badge, image: e.target.result });
        clearFields();
        fetchAdminProducts();
        alert("Product added successfully with image!");
      }
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      await addDoc(collection(db, "products"), { name, cat, price, pack, badge, image: "" });
      clearFields();
      fetchAdminProducts();
      alert("Product added successfully!");
    }
  }

  window.removeProduct = async function(id) {
    if(confirm("Are you sure you want to delete this confectionery item?")) {
      await deleteDoc(doc(db, "products", id));
      fetchAdminProducts();
    }
  }

  window.clearFields = function() {
    ["pName", "pPrice", "pPack", "pBadge", "pImage"].forEach(id => document.getElementById(id).value = "");
  }
</script>

<style>
body { background: #f6f1e6; font-family: 'Plus Jakarta Sans', sans-serif; color: #121816; padding: 30px 20px; }
.container { max-width: 800px; margin: auto; }
.card { background: #fff; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 25px; border: 1px solid rgba(181,139,60,0.3); }
h1, h2 { font-family: 'Playfair Display', serif; color: #0c3b2e; }
input, select { width: 100%; padding: 12px 15px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; outline: none; }
button.btn-primary { background: #0c3b2e; color: #fff; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
button.btn-primary:hover { background: #14533d; }
.back-link { display: inline-block; margin-bottom: 20px; color: #0c3b2e; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> &larr; Back to Store</a>
  
  <!-- Login Box -->
  <div id="loginBox" class="card" style="text-align: center;">
    <h1>Admin Secure Portal</h1>
    <p style="color:#666; margin-bottom:20px;">Mewah Farosh Confectionery Management</p>
    <input type="password" id="passInput" placeholder="Enter Admin Password" style="max-width: 350px;">
    <br>
    <button class="btn-primary" onclick="login()">Access Portal</button>
  </div>

  <!-- Dashboard Box -->
  <div id="dashboard" style="display:none;">
    <div class="card">
      <h2>Add New Confectionery Item</h2>
      <label>Product Name</label>
      <input type="text" id="pName" placeholder="e.g. Premium Iranian Dates">
      
      <label>Category</label>
      <select id="pCat">
        <option value="Dates">Dates</option>
        <option value="Nuts">Nuts</option>
        <option value="Seeds">Seeds</option>
        <option value="Dry Fruits">Dry Fruits</option>
      </select>

      <label>Price (₹)</label>
      <input type="number" id="pPrice" placeholder="e.g. 799">

      <label>Pack Size</label>
      <input type="text" id="pPack" placeholder="e.g. 500g">

      <label>Badge Tag (Optional)</label>
      <input type="text" id="pBadge" placeholder="e.g. Royal / Best Seller">

      <label>Product Image</label>
      <input type="file" id="pImage" accept="image/*">

      <button class="btn-primary" onclick="addNewProduct()">Publish Product Live</button>
    </div>

    <div class="card">
      <h2>Live Store Inventory</h2>
      <div id="productList" style="margin-top: 15px;"></div>
    </div>
  </div>
</div>
</body>
</html>
