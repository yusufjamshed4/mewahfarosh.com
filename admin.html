<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mewah Farosh - Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f1e6;margin:0;color:#18251f}.wrap{max-width:850px;margin:auto;padding:25px}.box{background:white;border-radius:18px;padding:25px;margin:20px 0;border:1px solid #ddd}
</style>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBW7ihA9k8Y8R2Nvp3wSqkTAubBhopp8pE",
    authDomain: "mewahfarosh-27a98.firebaseapp.com",
    projectId: "mewahfarosh-27a98",
    storageBucket: "mewahfarosh-27a98.firebasestorage.app",
    messagingSenderId: "1030846900586",
    appId: "1.1030846900586:web:5eb9e6b60151f6fc9b9d13",
    measurementId: "G-WXZE8XXVQ0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.Password = "MewahAdmin2026";
  window.login = function() {
    if(document.getElementById("pass").value === window.Password) {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      loadProducts();
    } else {
      alert("Wrong password!");
    }
  }

  window.loadProducts = async function() {
    const listDiv = document.getElementById("list");
    listDiv.innerHTML = "Loading...";
    const querySnapshot = await getDocs(collection(db, "products"));
    window.productsList = [];
    querySnapshot.forEach((docSnap) => {
      window.productsList.push({ id: docSnap.id, ...docSnap.data() });
    });
    renderAdminList();
  }

  window.renderAdminList = function() {
    const listDiv = document.getElementById("list");
    listDiv.innerHTML = window.productsList.map((p, index) => `
      <div class="product" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;">
        <span><b>${p.name}</b><br>${p.cat} • ${p.pack} • ₹${p.price}</span>
        <button class="danger" onclick="deleteProduct('${p.id}')" style="background:#b73232;color:white;border:none;padding:5px 10px;border-radius:5px;">Delete</button>
      </div>
    `).join('');
  }

  window.addProduct = async function() {
    const name = document.getElementById("name").value;
    const cat = document.getElementById("cat").value;
    const price = Number(document.getElementById("price").value);
    const pack = document.getElementById("pack").value;
    const badge = document.getElementById("badge").value;
    const file = document.getElementById("photo").files[0];

    if(!name || !price) {
      alert("Name and price required");
      return;
    }

    if(file) {
      const reader = new FileReader();
      reader.onload = async function(e) {
        await addDoc(collection(db, "products"), { name, cat, price, pack, badge, image: e.target.result });
        clearForm();
        loadProducts();
      }
      reader.readAsDataURL(file);
    } else {
      await addDoc(collection(db, "products"), { name, cat, price, pack, badge, image: "" });
      clearForm();
      loadProducts();
    }
  }

  window.deleteProduct = async function(id) {
    if(confirm("Delete this product?")) {
      await deleteDoc(doc(db, "products", id));
      loadProducts();
    }
  }

  window.clearForm = function() {
    ["name", "price", "pack", "badge"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("photo").value = "";
  }
</script>
</head>
<body>
<h1>MEWAH FAROSH — Admin</h1>
<div id="login" class="box">
  <h2>Admin Login</h2>
  <input id="pass" type="password" placeholder="Enter admin password">
  <button onclick="login()">Login</button>
</div>
<div id="app" class="box" style="display:none;">
  <h2>Add Product</h2>
  <input id="name" placeholder="Product name"><br><br>
  <select id="cat"><option>Dates</option><option>Dry Fruits</option><option>Seeds</option><option>Nuts</option></select><br><br>
  <input id="price" type="number" placeholder="Price e.g. 799"><br><br>
  <input id="pack" placeholder="Pack size e.g. 500g"><br><br>
  <input id="badge" placeholder="Badge e.g. Premium"><br><br>
  <input type="file" id="photo"><br><br>
  <button onclick="addProduct()">Add Product</button>
  <br><br>
  <h2>Products</h2>
  <div id="list"></div>
  <br>
  <a href="index.html"><button>Open Store</button></a>
</div>
</body>
</html>
